<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	
    <title>G터널 도감</title>
  
    <!-- PWA 설정 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111111">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- iOS 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="G터널 도감">
    <link rel="apple-touch-icon" href="https://tistory1.daumcdn.net/tistory/8280064/skin/images/apple-touch-icon.png">
    
    <!-- 파비콘 -->
    <link rel="icon" href="https://tistory1.daumcdn.net/tistory/8280064/skin/images/favicon.ico" type="image/x-icon">
</head>
	
	
    <title>G-GENE DATABASE</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f111a;
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif;
            color: #fff;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-body {
            flex: 1;
            overflow: hidden;
            padding-bottom: calc(70px + env(safe-area-inset-bottom));
        }
        .content-area {
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* 하단 네비게이션 바 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(70px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background: rgba(15, 23, 42, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(71, 85, 105, 0.3);
            display: flex;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            padding: 8px 0;
            transition: all 0.3s ease;
            color: #64748b;
            position: relative;
        }
        .nav-item.active {
            color: #06b6d4;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            border-radius: 0 0 3px 3px;
            box-shadow: 0 2px 8px rgba(6, 182, 212, 0.4);
        }
        .nav-item:active {
            transform: scale(0.95);
        }
        .nav-icon {
            width: 28px;
            height: 28px;
            filter: brightness(0.5) saturate(0);
            transition: all 0.3s ease;
        }
        .nav-item.active .nav-icon {
            filter: brightness(1) saturate(1);
        }
        .nav-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        /* 광고 오버레이 */
        #adOverlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .ad-box {
            background: #1e293b;
            padding: 36px 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #334155;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .ad-emoji {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .ad-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .ad-desc {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .btn-ad {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .btn-ad:active {
            transform: scale(0.98);
        }
        .btn-ad:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">


    <div class="app-container">
        <div class="main-body">
            <div class="content-area">
                <iframe id="contentFrame"></iframe>
            </div>
        </div>
        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <div class="nav-item active" onclick="trySwitchMenu('unit')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/unit_icon.png" alt="유닛" class="nav-icon">
                <div class="nav-label">유닛</div>
            </div>
            <div class="nav-item" onclick="trySwitchMenu('char')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/chara_icon.png" alt="캐릭터" class="nav-icon">
                <div class="nav-label">캐릭터</div>
            </div>
            <div class="nav-item" onclick="trySwitchMenu('news')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/newsicon.jpg" alt="뉴스" class="nav-icon">
                <div class="nav-label">뉴스</div>
            </div>
            <div class="nav-item" onclick="trySwitchMenu('guide')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/gong.png" alt="마스터 리그" class="nav-icon">
                <div class="nav-label">마스터 리그</div>
            </div>
            <div class="nav-item" onclick="trySwitchMenu('settings')">
                <img src="https://static.vecteezy.com/system/resources/previews/010/160/674/non_2x/coffee-icon-sign-symbol-design-free-png.png" alt="후원" class="nav-icon">
                <div class="nav-label">후원</div>
            </div>
			<div class="nav-item" onclick="trySwitchMenu('damage')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/Settings.png" alt="태그 매트릭스" class="nav-icon">
                <div class="nav-label">태그 매트릭스</div>
            </div>
			
			<div class="nav-item" onclick="trySwitchMenu('dmgs')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/Settings.png" alt="데미지 계산기" class="nav-icon">
                <div class="nav-label">데미지 계산기</div>
            </div>
			<div class="nav-item" onclick="trySwitchMenu('mls')">
                <img src="https://tistory1.daumcdn.net/tistory/8280064/skin/images/Settings.png" alt="마리 시뮬" class="nav-icon">
                <div class="nav-label">마리 시뮬</div>
            </div>
			
			
			
        </div>
    </div>
    <!-- 광고 오버레이 -->
    <div id="adOverlay">
        <div class="ad-box">
            <div class="ad-emoji">🎯</div>
            <div class="ad-title" id="adTitle">환영합니다!</div>
            <div class="ad-desc" id="adDesc">
                G-GENE DB를 이용하려면<br>
                후원사 링크를 확인해주세요.
            </div>
            <button class="btn-ad" onclick="handleAdClick()">🚀 확인하고 입장하기</button>
        </div>
    </div>

    <script>
          // 1. 우클릭 메뉴(Context Menu) 및 마우스 버튼 막기
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  }, false);

  // 2. 드래그 및 텍스트 선택 방지
  document.addEventListener('selectstart', function(e) {
    e.preventDefault();
  }, false);

  // 3. 복사(Ctrl+C), 잘라내기(Ctrl+X), 전체선택(Ctrl+A) 막기
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.keyCode === 67 || e.keyCode === 88 || e.keyCode === 65)) {
      e.preventDefault();
      return false;
    }
  }, false);

  // 4. 개발자 도구 (F12, Ctrl+Shift+I, Ctrl+U) 막기
  document.onkeydown = function(e) {
    if (e.keyCode === 123 || // F12
       (e.ctrlKey && e.shiftKey && (e.keyCode === 'I'.charCodeAt(0) || e.keyCode === 'J'.charCodeAt(0) || e.keyCode === 'C'.charCodeAt(0))) || // Ctrl+Shift+I/J/C
       (e.ctrlKey && e.keyCode === 'U'.charCodeAt(0))) { // Ctrl+U
      return false;
    }
  };
		
		if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js')
    .then(() => console.log('SW 등록 성공'))
    .catch(err => console.log('SW 등록 실패:', err));
}
		
		
		
				
		
		
		/* ========================== 광고 설정 ========================== */
        const MONETAG_DIRECT_LINK = "https://otieu.com/4/10522124"; // 광고 링크
        const IS_SUBSCRIBED = false; // 구독 여부 (true면 광고 제거)
        
        const FREE_SEARCH_LIMIT = 20;      // 무료 검색 횟수
        const REWARD_SEARCHES = 20;        // 광고 1회당 복구 검색 횟수
        const UNITS_PER_AD = 50;          // 광고 1회당 스크롤 가능 유닛 수 (유닛DB와 동일)
        const REWARD_SCROLL_UNITS = 50;   // 광고 시청 후 충전되는 유닛 수
        
        /* ========================== 전역 상태 ========================== */
        let searchCount = 0;              // 현재 검색 횟수
        let scrollCredits = UNITS_PER_AD; // 남은 스크롤 크레딧
        let lastCheckedUnits = 0;         // 마지막으로 체크한 유닛 인덱스
        
        let adType = "ENTRY";             // ENTRY, SEARCH, SCROLL, SWITCH
        let pendingMenuType = null;       // 대기 중인 메뉴
        let currentMenuType = 'unit';     // 현재 메뉴
        
        /* ========================== 초기화 ========================== */
        window.onload = function() {
            if (IS_SUBSCRIBED) {
                // 구독자는 광고 없이 바로 진입
                performMenuSwitch('unit');
            } else {
                // 진입 시 광고 표시
                //showAdOverlay('ENTRY');입장하면 광고를
				performMenuSwitch('unit');
            }
        };
        
        /* ========================== iframe 통신 ========================== */
        window.addEventListener('message', function(e) {
            // 검색 실행
            if (e.data?.type === 'CONTENT_SEARCH') {
                console.log('[MESSAGE] 📩 검색 메시지 수신');
                handleSearch();
            }
            // 스크롤 크레딧 체크
            else if (e.data?.type === 'CHECK_SCROLL_CREDIT') {
                console.log('[MESSAGE] 📜 스크롤 체크 메시지 수신:', e.data);
                handleScrollCredit(e.data.totalScrolledUnits);
            }
        });
        
        /* ========================== 검색 처리 ========================== */
        function handleSearch() {
            if (IS_SUBSCRIBED) {
                console.log('[SEARCH] 구독자 - 광고 없음');
                return;
            }
            
            searchCount++;
            console.log('[SEARCH] ✅ 검색 실행:', searchCount, '/', FREE_SEARCH_LIMIT);
            
            // 검색 한도 초과 시 광고 표시
            if (searchCount >= FREE_SEARCH_LIMIT) {
                console.log('[SEARCH] ⚠️ 검색 한도 초과! 광고 표시');
                showAdOverlay('SEARCH');
            }
            
            // 검색할 때마다 스크롤 크레딧 초기화
            scrollCredits = UNITS_PER_AD;
            lastCheckedUnits = 0;
            console.log('[SEARCH] 🔄 스크롤 크레딧 초기화:', scrollCredits, '개 유닛');
        }
        
        /* ========================== 스크롤 크레딧 처리 ========================== */
        function handleScrollCredit(totalScrolledUnits) {
            if (IS_SUBSCRIBED) {
                console.log('[SCROLL] 구독자 - 무제한');
                return;
            }
            
            console.log('[SCROLL] 총 스크롤한 유닛:', totalScrolledUnits, '/ 마지막 체크:', lastCheckedUnits, '/ 남은 크레딧:', scrollCredits);
            
            // 새로 스크롤한 유닛 수 계산
            const newUnits = totalScrolledUnits - lastCheckedUnits;
            
            if (newUnits > 0) {
                scrollCredits -= newUnits;
                lastCheckedUnits = totalScrolledUnits;
                
                console.log('[SCROLL] 새로 본 유닛:', newUnits, '개 / 남은 크레딧:', scrollCredits);
                
                // 크레딧 소진 시 광고 표시
                if (scrollCredits <= 0) {
                    console.log('[SCROLL] ⚠️ 크레딧 소진! 광고 표시');
                    showAdOverlay('SCROLL');
                    
                    // 스크롤 차단 메시지
                    document.getElementById('contentFrame').contentWindow.postMessage(
                        { type: 'BLOCK_SCROLL' },
                        '*'
                    );
                }
            }
        }
        
        /* ========================== 메뉴 전환 시도 (광고 체크) ========================== */
        function trySwitchMenu(type) {
            // 현재 메뉴와 같으면 무시
            if (type === currentMenuType) {
                return;
            }
            
            // 모든 메뉴 광고 없이 바로 이동
            performMenuSwitch(type);
        }
        
        /* ========================== 실제 메뉴 전환 ========================== */
        function performMenuSwitch(type) {
            const frame = document.getElementById('contentFrame');
            const timestamp = new Date().getTime();
            const addTs = (url) => url + (url.includes('?') ? '&' : '?') + 'v=' + timestamp;
            
            // 활성화 상태 업데이트
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            const navItems = document.querySelectorAll('.nav-item');
            
            switch(type) {
                case 'unit':
                    frame.src = addTs('ggenunit.html');
                    navItems[0].classList.add('active');
                    break;
                case 'char':
                    frame.src = addTs('ggenchara.html');
                    navItems[1].classList.add('active');
                    break;
                case 'news':
                    frame.src = addTs('https://web.gl.eternal.channel.or.jp/hr/information/update.html?is_official_site=1');
                    navItems[2].classList.add('active');
                    break;
                case 'guide':
                    frame.src = addTs('ml_search.html');
                    navItems[3].classList.add('active');
                    break;
                case 'settings':
                    frame.src = addTs('https://tistory1.daumcdn.net/tistory/8280064/skin/images/settings.html');
                    navItems[4].classList.add('active');
                    break;
				case 'damage':
                    frame.src = addTs('https://ggendb.up.railway.app/tm');
                    navItems[5].classList.add('active');
                    break;	
					
				case 'dmgs':
                    frame.src = addTs('https://ggendb.up.railway.app/cal');
                    navItems[6].classList.add('active');
                    break;
					
				case 'mls':
        window.open(addTs('https://gge-simulator.jp/'), '_blank');
        navItems[7].classList.add('active');
        break;	
					
					
					
            }
            
            currentMenuType = type;
            console.log('[MENU] 메뉴 전환:', type);
        }
        
        /* ========================== 광고 오버레이 표시 ========================== */
        function showAdOverlay(type) {
            adType = type;
            const overlay = document.getElementById('adOverlay');
            const title = document.getElementById('adTitle');
            const desc = document.getElementById('adDesc');
            const btn = overlay.querySelector('.btn-ad');
            const emoji = overlay.querySelector('.ad-emoji');
            
            if (type === 'ENTRY') {
                emoji.textContent = '🎯';
                title.textContent = '환영합니다!';
                desc.innerHTML = 'G-GENE DB를 이용하려면<br>후원사 링크를 확인해주세요.';
                btn.textContent = '🚀 확인하고 입장하기';
            } 
            else if (type === 'SEARCH') {
                emoji.textContent = '🔒';
                title.textContent = '검색 한도 초과';
                desc.innerHTML = `무료 검색 횟수를 모두 사용했습니다.<br>광고를 보고 충전하세요.<br><small style="color:#64748b;">감사합니다</small>`;
                btn.textContent = '📺 광고 보고 충전하기';
            } 
            else if (type === 'SCROLL') {
                emoji.textContent = '⬇️';
                title.textContent = '스크롤 한도 초과';
                desc.innerHTML = `더 많은 유닛을 보려면<br><b style="color:#06b6d4;">광고 시청</b>이 필요합니다.<br><small style="color:#64748b;">감사합니다</small>`;
                btn.textContent = '📺 광고 보고 계속 보기';
            } 
            else if (type === 'SWITCH') {
                emoji.textContent = '🔄';
                title.textContent = 'DB 전환';
                desc.innerHTML = '다른 데이터베이스로 이동합니다.<br>이동 전 후원사 링크가 표시됩니다.';
                btn.textContent = '🔄 이동하기';
            }
            
            overlay.style.display = 'flex';
        }
        
        /* ========================== 광고 클릭 처리 ========================== */
        function handleAdClick() {
            // 광고 링크 새창으로 열기
            window.open(MONETAG_DIRECT_LINK, '_blank');
            
            const btn = document.querySelector('.btn-ad');
            const originalText = btn.textContent;
            btn.textContent = '확인 중...';
            btn.disabled = true;
            
            // 1.5초 후 광고 처리
            setTimeout(() => {
                document.getElementById('adOverlay').style.display = 'none';
                
                if (adType === 'ENTRY') {
                    // 진입 광고 - 유닛 DB로 이동
                    performMenuSwitch('unit');
                } 
                else if (adType === 'SEARCH') {
                    // 검색 광고 - 검색 카운트 복구
                    searchCount = Math.max(0, searchCount - REWARD_SEARCHES);
                    console.log('[AD] 검색 크레딧 복구:', searchCount);
                } 
                else if (adType === 'SCROLL') {
                    // 스크롤 광고 - 스크롤 크레딧 충전
                    scrollCredits += REWARD_SCROLL_UNITS;
                    console.log('[AD] 스크롤 크레딧 충전:', scrollCredits);
                    
                    // 스크롤 차단 해제
                    document.getElementById('contentFrame').contentWindow.postMessage(
                        { type: 'UNBLOCK_SCROLL' },
                        '*'
                    );
                } 
                else if (adType === 'SWITCH' && pendingMenuType) {
                    // 메뉴 전환 광고 - 대기 중인 메뉴로 이동
                    performMenuSwitch(pendingMenuType);
                    pendingMenuType = null;
                }
                
                btn.textContent = originalText;
                btn.disabled = false;
            }, 1500);
        }
    </script>
</body>
</html>
